<section id="sbom-components-section">
  <h1 class="font-weight-light">{{ 'sbom.COMPONENTS' | translate }}</h1>
  <mat-card class="mb-3">
    <form
      class="d-flex flex-wrap align-items-start"
      [formGroup]="form"
      (ngSubmit)="search()">
      <mat-form-field class="me-3">
        <mat-label>{{ 'sbom.NAME' | translate }}</mat-label>
        <input matInput formControlName="name" maxlength="256" />
        <mat-hint>{{ 'sbom.NAME_OR_PURL_REQUIRED' | translate }}</mat-hint>
      </mat-form-field>
      <mat-form-field class="me-3">
        <mat-label>{{ 'sbom.PURL' | translate }}</mat-label>
        <input matInput formControlName="purl" maxlength="512" />
      </mat-form-field>
      <mat-form-field class="me-3">
        <mat-label>{{ 'sbom.VERSION' | translate }}</mat-label>
        <input matInput formControlName="version" maxlength="128" />
        <mat-hint>{{ 'sbom.VERSION_HINT' | translate }}</mat-hint>
      </mat-form-field>
      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="mt-2"
        [disabled]="!canSearch">
        {{ 'sbom.SEARCH' | translate }}
      </button>
    </form>
  </mat-card>
  <ng-container *ngIf="searched">
    <mat-card *ngFor="let section of sections" class="mb-3">
      <h2 class="h4">
        {{ section.titleKey | translate }} ({{ section.rows.length }})
      </h2>
      <ag-grid-angular
        class="ag-theme-alpine"
        style="width: 100%; height: 250px"
        [rowData]="section.rows"
        [columnDefs]="section.columnDefs"
        [overlayNoRowsTemplate]="'general.NO_ROWS' | translate"
        (gridSizeChanged)="onGridSizeChanged($event)"
        (rowClicked)="section.onRowClicked?.($event.data)">
      </ag-grid-angular>
    </mat-card>
  </ng-container>
</section>
